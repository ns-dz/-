<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دليل العلامة — بناء العلامة التجارية الاستراتيجية خطوة بخطوة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================
       المتغيرات — نظام التصميم
       ========================================================== */
    :root {
      --black: #111111;
      --black-soft: #1a1a1a;
      --black-mute: #242424;
      --ivory: #f5f2ea;
      --ivory-soft: #faf8f2;
      --orange: #e8622b;
      --orange-soft: #ff7a45;
      --orange-dim: rgba(232, 98, 43, 0.12);
      --line: rgba(17, 17, 17, 0.10);
      --line-dark: rgba(245, 242, 234, 0.12);
      --text: #1b1b1b;
      --text-soft: #5b564c;
      --text-dark-soft: rgba(245, 242, 234, 0.62);
      --radius: 4px;
      --font-sans: "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: "Amiri", Georgia, serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --sidebar-w: 320px;
    }

    /* ==========================================================
       إعادة الضبط
       ========================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--ivory);
      color: var(--text);
      line-height: 1.85;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; }
    ul, ol { padding-inline-start: 1.4em; }
    ::selection { background: var(--orange); color: #fff; }

    /* شريط التمرير */
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(17,17,17,0.18); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--orange); }

    .is-hidden { display: none !important; }

    /* ==========================================================
       الشاشة 1 — صفحة الدخول
       ========================================================== */
    #accessScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 85% -10%, rgba(232,98,43,0.16), transparent 55%),
        radial-gradient(circle at 0% 100%, rgba(232,98,43,0.08), transparent 45%),
        var(--black);
      overflow: hidden;
      transition: opacity .7s var(--ease), visibility .7s var(--ease);
    }
    #accessScreen.leaving { opacity: 0; visibility: hidden; pointer-events: none; }

    /* خطوط زخرفية خفيفة */
    #accessScreen::before,
    #accessScreen::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(245,242,234,0.07);
      border-radius: 50%;
      pointer-events: none;
    }
    #accessScreen::before { width: 620px; height: 620px; top: -260px; left: -200px; }
    #accessScreen::after { width: 420px; height: 420px; bottom: -180px; right: -140px; }

    .access-card {
      position: relative;
      width: 100%;
      max-width: 470px;
      padding: 52px 44px 44px;
      background: rgba(26,26,26,0.72);
      border: 1px solid rgba(245,242,234,0.10);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 40px 90px -30px rgba(0,0,0,0.8);
      text-align: center;
      animation: riseIn .9s var(--ease) both;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* الشعار — صورة أو حرف بديل */
    .brand-mark {
      width: 68px; height: 68px;
      margin: 0 auto 20px;
      display: grid; place-items: center;
      border: 1px solid rgba(232,98,43,0.55);
      border-radius: 50%;
      overflow: hidden;
      background: var(--black);
      color: var(--orange);
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      position: relative;
    }
    .brand-mark img {
      width: 100%; height: 100%;
      object-fit: contain;
      padding: 10px;
      display: block;
    }
    .brand-mark span {
      position: absolute;
      inset: 0;
      display: grid; place-items: center;
    }

    .brand-name {
      font-size: 13px;
      letter-spacing: 0.32em;
      color: var(--orange);
      text-transform: uppercase;
      margin: 0 0 26px;
      font-weight: 500;
    }
    .access-title {
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.35;
      color: var(--ivory);
      margin: 0 0 14px;
    }
    .access-sub {
      font-size: 15px;
      color: var(--text-dark-soft);
      line-height: 1.9;
      margin: 0 0 34px;
      font-weight: 300;
    }

    .field { position: relative; margin-bottom: 14px; text-align: right; }
    .field label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--text-dark-soft);
      margin-bottom: 9px;
      font-weight: 500;
    }
    .input-wrap { position: relative; }
    #passwordInput {
      width: 100%;
      padding: 15px 16px 15px 52px;
      font-family: inherit;
      font-size: 16px;
      color: var(--ivory);
      background: rgba(245,242,234,0.05);
      border: 1px solid rgba(245,242,234,0.16);
      border-radius: var(--radius);
      outline: none;
      letter-spacing: 0.08em;
      transition: border-color .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
    }
    #passwordInput::placeholder { color: rgba(245,242,234,0.28); letter-spacing: normal; }
    #passwordInput:focus {
      border-color: var(--orange);
      background: rgba(232,98,43,0.06);
      box-shadow: 0 0 0 4px rgba(232,98,43,0.12);
    }
    .toggle-pass {
      position: absolute;
      left: 8px; top: 50%;
      transform: translateY(-50%);
      width: 38px; height: 38px;
      display: grid; place-items: center;
      color: var(--text-dark-soft);
      border-radius: 50%;
      transition: color .25s, background .25s;
    }
    .toggle-pass:hover { color: var(--orange); background: rgba(232,98,43,0.1); }
    .toggle-pass svg { width: 19px; height: 19px; }

    .error-msg {
      min-height: 22px;
      font-size: 13.5px;
      color: var(--orange-soft);
      margin: 4px 2px 14px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }
    .error-msg.show { opacity: 1; transform: translateY(0); }

    .btn-enter {
      position: relative;
      width: 100%;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: var(--orange);
      border-radius: var(--radius);
      overflow: hidden;
      transition: background .3s var(--ease), transform .2s var(--ease), box-shadow .3s var(--ease);
      box-shadow: 0 14px 34px -14px rgba(232,98,43,0.9);
    }
    .btn-enter:hover:not(:disabled) { background: var(--orange-soft); transform: translateY(-1px); }
    .btn-enter:active:not(:disabled) { transform: translateY(0); }
    .btn-enter:disabled { cursor: default; opacity: 0.9; }
    .btn-enter .btn-label { display: inline-flex; align-items: center; gap: 9px; }
    .btn-enter.loading .btn-label { opacity: 0; }
    .spinner {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 21px; height: 21px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      opacity: 0;
      animation: spin .7s linear infinite;
      transition: opacity .2s;
    }
    .btn-enter.loading .spinner { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .demo-note {
      margin: 26px 0 0;
      padding-top: 20px;
      border-top: 1px solid rgba(245,242,234,0.09);
      font-size: 12px;
      line-height: 1.9;
      color: rgba(245,242,234,0.40);
      font-weight: 300;
    }
    .demo-note code {
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      background: rgba(232,98,43,0.14);
      color: var(--orange-soft);
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11.5px;
      letter-spacing: 0.04em;
    }

    /* ==========================================================
       الشاشة 2 — تطبيق القراءة
       ========================================================== */
    #guideApp {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--ivory);
      animation: fadeIn .7s var(--ease) both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- الهيدر --- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 26px;
      height: 72px;
      background: rgba(245,242,234,0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-logo {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      background: var(--black);
      color: var(--orange);
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .header-logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      padding: 5px;
      display: block;
    }
    .header-logo span {
      position: absolute;
      inset: 0;
      display: grid; place-items: center;
    }
    .header-titles { min-width: 0; }
    .header-brandname {
      font-size: 10.5px;
      letter-spacing: 0.26em;
      color: var(--orange);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.4;
    }
    .header-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.5;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 12px;
    }
    .progress-bar {
      flex: 1;
      height: 3px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      min-width: 40px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--orange);
      border-radius: 99px;
      transition: width .35s var(--ease);
    }
    .progress-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .icon-btn {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: var(--text-soft);
      transition: background .25s, color .25s;
    }
    .icon-btn:hover { background: var(--orange-dim); color: var(--orange); }
    .icon-btn svg { width: 20px; height: 20px; }

    .btn-logout {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 99px;
      transition: all .25s var(--ease);
    }
    .btn-logout:hover { background: var(--black); color: var(--ivory); border-color: var(--black); }
    .btn-logout svg { width: 16px; height: 16px; }

    /* --- الهيكل العام --- */
    .app-body { display: flex; flex: 1; min-height: 0; }

    /* --- الشريط الجانبي --- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--ivory-soft);
      border-left: 1px solid var(--line);
      position: sticky;
      top: 72px;
      height: calc(100vh - 72px);
      overflow-y: auto;
      transition: width .4s var(--ease), transform .4s var(--ease);
      z-index: 30;
    }
    .sidebar.collapsed { width: 0; overflow: hidden; border-left: none; }
    .sidebar-inner { padding: 30px 22px 40px; min-width: 280px; }

    .sidebar-heading {
      font-size: 11px;
      letter-spacing: 0.24em;
      color: var(--orange);
      font-weight: 800;
      text-transform: uppercase;
      margin: 0 0 20px;
      padding-right: 6px;
    }

    .chapter-list { list-style: none; margin: 0; padding: 0; }
    .chapter-item { margin-bottom: 2px; }
    .chapter-link {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      width: 100%;
      padding: 11px 12px;
      text-align: right;
      border-radius: var(--radius);
      color: var(--text-soft);
      font-size: 14.5px;
      line-height: 1.55;
      transition: background .22s var(--ease), color .22s var(--ease);
      position: relative;
    }
    .chapter-link:hover { background: rgba(17,17,17,0.045); color: var(--text); }
    .chapter-link.active {
      background: var(--black);
      color: var(--ivory);
    }
    .chapter-link.active .chapter-num { color: var(--orange); }
    .chapter-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--orange);
      letter-spacing: 0.06em;
      flex-shrink: 0;
      padding-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .chapter-link.active .chapter-num { color: var(--orange-soft); }
    .chapter-name { flex: 1; font-weight: 500; }
    .chapter-link.active .chapter-name { font-weight: 700; }

    /* --- منطقة القراءة --- */
    .reader {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 54px 32px 100px;
    }
    .reader-inner {
      width: 100%;
      max-width: 740px;
    }

    .chapter-kicker {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .kicker-num {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--orange);
      text-transform: uppercase;
    }
    .kicker-line { flex: 1; height: 1px; background: var(--line); max-width: 90px; }

    .chapter-title {
      font-size: clamp(30px, 4.5vw, 46px);
      font-weight: 800;
      line-height: 1.3;
      color: var(--text);
      margin: 0 0 16px;
      letter-spacing: -0.01em;
    }
    .chapter-intro {
      font-size: 18px;
      line-height: 1.9;
      color: var(--text-soft);
      margin: 0 0 34px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--line);
      font-weight: 300;
    }

    /* عناصر المحتوى */
    .content h2 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text);
      margin: 48px 0 18px;
      letter-spacing: -0.01em;
    }
    .content h3 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text);
      margin: 34px 0 14px;
    }
    .content p { margin: 0 0 20px; font-size: 17px; line-height: 1.9; color: #2a2a2a; }
    .content strong { font-weight: 700; color: var(--text); }
    .content em { font-style: italic; }

    .content ul, .content ol { margin: 0 0 24px; padding-inline-start: 1.3em; }
    .content li { margin-bottom: 10px; font-size: 17px; line-height: 1.85; color: #2a2a2a; }
    .content li::marker { color: var(--orange); font-weight: 700; }

    .content blockquote {
      margin: 30px 0;
      padding: 22px 26px;
      background: var(--ivory-soft);
      border-right: 3px solid var(--orange);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.8;
      color: var(--text);
    }
    .content blockquote p:last-child { margin-bottom: 0; }

    /* جدول */
    .table-wrap { overflow-x: auto; margin: 26px 0; border: 1px solid var(--line); border-radius: var(--radius); }
    .content table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 460px; }
    .content th {
      background: var(--black);
      color: var(--ivory);
      font-weight: 700;
      text-align: right;
      padding: 13px 16px;
      font-size: 13.5px;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .content td {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      line-height: 1.7;
      vertical-align: top;
    }
    .content tbody tr:nth-child(even) { background: rgba(17,17,17,0.025); }

    /* صندوق مثال */
    .example-box {
      margin: 30px 0;
      padding: 24px 26px;
      background: var(--ivory-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .example-box .box-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 12px;
    }
    .example-box p:last-child { margin-bottom: 0; }

    /* صندوق تمرين */
    .exercise-box {
      margin: 34px 0;
      padding: 26px 28px;
      background: var(--black);
      border-radius: var(--radius);
      color: var(--ivory);
    }
    .exercise-box .box-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange-soft);
      margin-bottom: 14px;
    }
    .exercise-box p { color: rgba(245,242,234,0.86); margin-bottom: 14px; }
    .exercise-box p:last-child { margin-bottom: 0; }
    .exercise-box strong { color: var(--ivory); }
    .exercise-box ul, .exercise-box ol { margin-bottom: 0; }
    .exercise-box li { color: rgba(245,242,234,0.86); }
    .exercise-box li::marker { color: var(--orange); }

    /* صندوق ملاحظة مهمة */
    .note-box {
      margin: 30px 0;
      padding: 22px 26px;
      background: var(--orange-dim);
      border-right: 3px solid var(--orange);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .note-box .box-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 10px;
    }
    .note-box p:last-child { margin-bottom: 0; }

    /* صور */
    .content figure { margin: 30px 0; }
    .content figure img { border-radius: var(--radius); width: 100%; }
    .content figcaption {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-soft);
      text-align: center;
    }

    /* --- التنقل بين الفصول --- */
    .chapter-nav {
      display: flex;
      align-items: stretch;
      gap: 16px;
      margin-top: 64px;
      padding-top: 36px;
      border-top: 1px solid var(--line);
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      text-align: right;
      transition: all .28s var(--ease);
      background: transparent;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--black);
      border-color: var(--black);
      color: var(--ivory);
      transform: translateY(-2px);
      box-shadow: 0 16px 34px -20px rgba(0,0,0,0.6);
    }
    .nav-btn:hover:not(:disabled) .nav-label { color: var(--orange-soft); }
    .nav-btn:disabled { opacity: 0.32; cursor: not-allowed; }
    .nav-btn.next { text-align: left; align-items: flex-end; }
    .nav-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--orange);
      transition: color .28s;
    }
    .nav-title { font-size: 15px; font-weight: 700; line-height: 1.5; }

    .chapter-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* --- شاشة منتصف الجوال --- */
    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17,17,17,0.5);
      z-index: 29;
      opacity: 0;
      transition: opacity .3s var(--ease);
    }
    .mobile-overlay.active { display: block; opacity: 1; }

    /* ==========================================================
       الاستجابة
       ========================================================== */
    @media (max-width: 1024px) {
      :root { --sidebar-w: 290px; }
      .reader { padding: 44px 26px 90px; }
    }

    @media (max-width: 860px) {
      .app-header { padding: 0 16px; gap: 12px; height: 64px; }
      .sidebar { top: 64px; height: calc(100vh - 64px); }

          <p>المجتمع هو أن يجتمع عملاؤك حول شيء يحبونه ويتحدثون مع بعضهم، لا معك وحدك. العلامات التي تبني مجتمعاً تحصل على ولاء يصعب على المنافس كسره. وللبدء:</p>
          <ol>
            <li><strong>حدد القاسم المشترك:</strong> ما الاهتمام أو القيمة التي تجمع عملاءك؟ (حب القهوة، تربية الأطفال، ريادة الأعمال...)</li>
            <li><strong>اختر مكاناً لللقاء:</strong> مجموعة واتساب أو تلغرام، مجموعة فيسبوك، قناة مغلقة، أو لقاءات واقعية.</li>
            <li><strong>ابدأ بالقيمة:</strong> قدّم نصائح وأسئلة وتحديات، لا مجرد إعلانات.</li>
            <li><strong>اجعل الأعضاء أبطالاً:</strong> أبرز مساهماتهم وصورهم وقصصهم.</li>
            <li><strong>ضع قواعد واضحة:</strong> الاحترام ومنع الإعلانات العشوائية، وأدر المجتمع بحضور حقيقي.</li>
          </ol>
          <h3>المسؤولية الاجتماعية: بصدق لا بدعاية</h3>
          <p>الناس اليوم يهتمون بما تمثله العلامة. إن كانت لديك قضية حقيقية (بيئة، مجتمع محلي، تعليم) فاجعلها جزءاً من عملك بالفعل: شراكة مع جمعية، أو التزام بيئة أنظف، أو تشغيل فئة تحتاج فرصة. لكن احذر من التظاهر: فالموقف الذي لا يتنسق مع سلوكك اليومي ينقلب عليك ويصبح سبب خسارة للثقة.</p>
          <h3>التوصية: أقوى قناة تسويق</h3>
          <p>لا شيء يقع الناس مثل توصية صديق. لتشجيعها: قدّم تجربة تستحق الحديث عنها، واطلب التوصية صراحة في اللحظة المناسبة، وسهل المشاركة (رابط، رمز خصم للصديق، صورة جاهزة)، وكافئ الموصي والموصى إليه معاً دون مبالغة.</p>
          <h3>قياس الولاء: سؤال واحد</h3>
          <p>اسأل عملاءك دورياً: "من 1 إلى 10، ما احتمال أن توصي بنا لصديق؟" ثم أسألهم "لماذا؟" واقرأ الأجوبة بعناية. من أجاب بـ 9 أو 10 فهو مخلص، ومن أجاب بـ 7 أو 8 فهو مرضي، ومن أجاب بـ 6 فأقل فهو غير راضٍ.</p>
          <div class="exercise-box">
            <span class="box-label">تمرين تطبيقي</span>
            <p>حدد أين يقف أغلب عملائك على سلم الولاء، واختر خطوة واحدة تنقلهم إلى الدرجة التالية. ثم اكتب فكرة برنامج مكافآت بسيط في ثلاثة أسطر، وسؤالاً واحداً ستطرحه على 10 عملاء هذا الأسبوع.</p>
          </div>
        `
      }
    ];

    /* ==========================================================
       نظام كلمات المرور المتجدد
       ========================================================== */
    const PASSWORDS = [
      "PNT-EX00-X00",
      "X-013-EXNOX",
      "DA-LI-00-LIX"
    ];

    const AuthService = {
      // الحصول على رقم كلمة المرور الحالية من التخزين
      getCurrentIndex() {
        const stored = parseInt(localStorage.getItem("exnox_pass_index") || "0", 10);
        return (isNaN(stored) || stored < 0 || stored >= PASSWORDS.length) ? 0 : stored;
      },

      // التحقق من كلمة المرور
      async verify(password) {
        return new Promise((resolve) => {
          setTimeout(() => {
            const currentIndex = this.getCurrentIndex();
            resolve(password === PASSWORDS[currentIndex]);
          }, 800);
        });
      },

      // الانتقال إلى كلمة المرور التالية
      advance() {
        let current = this.getCurrentIndex();
        current = (current + 1) % PASSWORDS.length;
        localStorage.setItem("exnox_pass_index", String(current));
      }
    };

    /* ==========================================================
       حالة التطبيق
       ========================================================== */
    const state = {
      currentChapterIndex: 0,
      isAuthenticated: false
    };

    /* ==========================================================
       عناصر DOM
       ========================================================== */
    const $ = (sel) => document.querySelector(sel);

    const accessScreen = $("#accessScreen");
    const guideApp = $("#guideApp");
    const passwordInput = $("#passwordInput");
    const togglePassBtn = $("#togglePass");
    const eyeIcon = $("#eyeIcon");
    const enterBtn = $("#enterBtn");
    const errorMsg = $("#errorMsg");
    const chapterList = $("#chapterList");
    const chapterContent = $("#chapterContent");
    const progressFill = $("#progressFill");
    const progressLabel = $("#progressLabel");
    const sidebar = $("#sidebar");
    const sidebarToggle = $("#sidebarToggle");
    const logoutBtn = $("#logoutBtn");
    const mobileOverlay = $("#mobileOverlay");

    /* ==========================================================
       طبقة التخزين المحلي
       ========================================================== */
    const Storage = {
      KEY_CHAPTER: "exnox_guide_chapter",
      KEY_AUTH: "exnox_guide_auth",

      saveChapter(index) {
        try { localStorage.setItem(this.KEY_CHAPTER, String(index)); } catch (e) {}
      },
      getChapter() {
        try {
          const v = localStorage.getItem(this.KEY_CHAPTER);
          const n = parseInt(v, 10);
          return Number.isInteger(n) && n >= 0 && n < CHAPTERS.length ? n : 0;
        } catch (e) { return 0; }
      },
      setAuth(val) {
        try { localStorage.setItem(this.KEY_AUTH, val ? "1" : "0"); } catch (e) {}
      },
      getAuth() {
        try { return localStorage.getItem(this.KEY_AUTH) === "1"; } catch (e) { return false; }
      },
      clearAuth() {
        try { localStorage.removeItem(this.KEY_AUTH); } catch (e) {}
      }
    };

    /* ==========================================================
       عرض الفصول في الشريط الجانبي
       ========================================================== */
    function renderSidebar() {
      chapterList.innerHTML = CHAPTERS.map((ch, i) => `
        <li class="chapter-item">
          <button class="chapter-link ${i === state.currentChapterIndex ? "active" : ""}"
                  data-index="${i}">
            <span class="chapter-num">${ch.num}</span>
            <span class="chapter-name">${ch.title}</span>
          </button>
        </li>
      `).join("");
    }

    /* ==========================================================
       عرض محتوى الفصل الحالي
       ========================================================== */
    function renderChapter(index) {
      if (index < 0 || index >= CHAPTERS.length) return;
      state.currentChapterIndex = index;

      const ch = CHAPTERS[index];
      const prev = CHAPTERS[index - 1];
      const next = CHAPTERS[index + 1];

      chapterContent.innerHTML = `
        <div class="chapter-kicker">
          <span class="kicker-num">الفصل ${ch.num}</span>
          <span class="kicker-line"></span>
        </div>
        <h1 class="chapter-title">${ch.title}</h1>
        <p class="chapter-intro">${ch.intro}</p>
        <div class="content">${ch.content}</div>

        <nav class="chapter-nav">
          <button class="nav-btn prev" ${prev ? "" : "disabled"} data-nav="${index - 1}">
            <span class="nav-label">السابق</span>
            <span class="nav-title">${prev ? prev.title : "—"}</span>
          </button>
          <div class="chapter-indicator">${index + 1} / ${CHAPTERS.length}</div>
          <button class="nav-btn next" ${next ? "" : "disabled"} data-nav="${index + 1}">
            <span class="nav-label">التالي</span>
            <span class="nav-title">${next ? next.title : "—"}</span>
          </button>
        </nav>
      `;

      // تحديث الشريط الجانبي
      chapterList.querySelectorAll(".chapter-link").forEach((btn) => {
        const i = parseInt(btn.dataset.index, 10);
        btn.classList.toggle("active", i === index);
      });

      // حفظ التقدم
      Storage.saveChapter(index);
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ==========================================================
       شريط تقدم القراءة
       ========================================================== */
    function updateProgress() {
      const pct = ((state.currentChapterIndex + 1) / CHAPTERS.length) * 100;
      progressFill.style.width = pct + "%";
      progressLabel.textContent = Math.round(pct) + "%";
    }

    /* ==========================================================
       إظهار تطبيق الدليل
       ========================================================== */
    function showGuide() {
      state.isAuthenticated = true;
      Storage.setAuth(true);
      accessScreen.classList.add("leaving");

      setTimeout(() => {
        accessScreen.classList.add("is-hidden");
        guideApp.classList.remove("is-hidden");

        // استعادة الفصل الأخير
        const savedIndex = Storage.getChapter();
        renderSidebar();
        renderChapter(savedIndex);
      }, 700);
    }

    /* ==========================================================
       تسجيل الخروج — مع تدوير كلمة المرور
       ========================================================== */
    function logout() {
      state.isAuthenticated = false;
      Storage.clearAuth();

      // تدوير كلمة المرور إلى التالية
      AuthService.advance();

      guideApp.classList.add("is-hidden");
      accessScreen.classList.remove("is-hidden", "leaving");
      passwordInput.value = "";
      errorMsg.textContent = "";
      errorMsg.classList.remove("show");
      enterBtn.classList.remove("loading");
      enterBtn.disabled = false;
      sidebar.classList.remove("open", "collapsed");
      mobileOverlay.classList.remove("active");
      setTimeout(() => passwordInput.focus(), 300);
    }

    /* ==========================================================
       أحداث واجهة الدخول
       ========================================================== */
    function togglePasswordVisibility() {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeIcon.innerHTML = isPassword
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      togglePassBtn.setAttribute("aria-label", isPassword ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
    }

    async function handleEnter() {
      const password = passwordInput.value.trim();

      if (!password) {
        showError("الرجاء إدخال كلمة المرور.");
        return;
      }

      errorMsg.classList.remove("show");
      enterBtn.classList.add("loading");
      enterBtn.disabled = true;

      const ok = await AuthService.verify(password);

      if (ok) {
        setTimeout(() => {
          enterBtn.classList.remove("loading");
          showGuide();
        }, 300);
      } else {
        enterBtn.classList.remove("loading");
        enterBtn.disabled = false;
        showError("كلمة المرور غير صحيحة. حاول مرة أخرى.");
        passwordInput.focus();
        passwordInput.select();
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add("show");
    }

    /* ==========================================================
       أحداث التنقل في الدليل
       ========================================================== */
    function handleChapterClick(e) {
      const btn = e.target.closest(".chapter-link");
      if (!btn) return;
      const index = parseInt(btn.dataset.index, 10);
      if (Number.isInteger(index)) {
        renderChapter(index);
        closeSidebarOnMobile();
      }
    }

    function handleNavClick(e) {
      const btn = e.target.closest("[data-nav]");
      if (!btn || btn.disabled) return;
      const index = parseInt(btn.dataset.nav, 10);
      if (Number.isInteger(index) && index >= 0 && index < CHAPTERS.length) {
        renderChapter(index);
      }
    }

    /* ==========================================================
       الشريط الجانبي على الجوال
       ========================================================== */
    function isMobile() { return window.innerWidth <= 860; }

    function toggleSidebar() {
      if (isMobile()) {
        const isOpen = sidebar.classList.contains("open");
        sidebar.classList.toggle("open", !isOpen);
        mobileOverlay.classList.toggle("active", !isOpen);
        document.body.style.overflow = !isOpen ? "hidden" : "";
      } else {
        sidebar.classList.toggle("collapsed");
      }
    }

    function closeSidebarOnMobile() {
      if (isMobile()) {
        sidebar.classList.remove("open");
        mobileOverlay.classList.remove("active");
        document.body.style.overflow = "";
      }
    }

    /* ==========================================================
       ربط الأحداث
       ========================================================== */
    function bindEvents() {
      togglePassBtn.addEventListener("click", togglePasswordVisibility);
      enterBtn.addEventListener("click", handleEnter);
      passwordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); handleEnter(); }
      });
      passwordInput.addEventListener("input", () => {
        if (errorMsg.classList.contains("show")) errorMsg.classList.remove("show");
      });

      chapterList.addEventListener("click", handleChapterClick);
      chapterContent.addEventListener("click", handleNavClick);

      sidebarToggle.addEventListener("click", toggleSidebar);
      mobileOverlay.addEventListener("click", closeSidebarOnMobile);
      logoutBtn.addEventListener("click", logout);

      window.addEventListener("resize", () => {
        if (!isMobile()) {
          sidebar.classList.remove("open");
          mobileOverlay.classList.remove("active");
          document.body.style.overflow = "";
        }
      });
    }

    /* ==========================================================
       التهيئة
       ========================================================== */
    function init() {
      bindEvents();

      // استعادة الجلسة إن وجدت
      if (Storage.getAuth()) {
        accessScreen.classList.add("is-hidden");
        guideApp.classList.remove("is-hidden");
        state.isAuthenticated = true;

        const savedIndex = Storage.getChapter();
        renderSidebar();
        renderChapter(savedIndex);
      } else {
        setTimeout(() => passwordInput.focus(), 600);
      }
    }

    document.addEventListener("DOMContentLoaded", init);

  })();
  </script>
</body>
</html>
